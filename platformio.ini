; BreakBeam speed gates - PlatformIO project
;
; One firmware for both gates. Build + upload it to each Uno, then in the serial
; monitor type  role start  or  role finish  (once per board - it is remembered).
;
; Upload:   PlatformIO toolbar -> Upload   (or:  pio run -t upload --upload-port COM3)
; Monitor:  PlatformIO toolbar -> Serial Monitor (115200 baud, send "newline" endings)

[platformio]
src_dir      = BreakBeam
default_envs = uno

[env:uno]
platform      = atmelavr
board         = uno
framework     = arduino
monitor_speed = 115200
monitor_eol   = LF
monitor_echo  = yes
; If you have both boards plugged in, tell PlatformIO which one to use, e.g.:
; upload_port  = COM3
; monitor_port = COM3
